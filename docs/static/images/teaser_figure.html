<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motivation Figure</title>

    <style>

        body {

            margin: 0;

            padding: 40px;

            background-color: blue;

            display: flex;

            flex-direction: column;

            align-items: center;

            font-family: Arial, sans-serif;

        }



        .title {

            color: white;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 20px;

            text-align: center;

        }



        .line {

            width: 100%;

            max-width: 800px;

            height: 2px;

            background-color: white;

            margin-bottom: 30px;

        }



        .sparse-data-container {

            display: flex;

            justify-content: center;

            align-items: center;

        }



        .sparse-data-container svg,

        .sparse-data-container object {

            max-width: 100%;

            height: auto;

        }



        .domain-shifts-container {

            display: flex;

            flex-direction: row;

            justify-content: center;

            align-items: center;

            gap: 30px;

            flex-wrap: wrap;

        }



        .domain-shifts-container svg,

        .domain-shifts-container object {

            max-width: 100%;

            height: auto;

        }

    </style>

</head>

<body>

    <div class="title">Limited data</div>

    <div class="line"></div>

    <div class="sparse-data-container">

        <object data="sparse_data.svg" type="image/svg+xml" width="809" height="254">

            <img src="sparse_data.svg" alt="Sparse data visualization" />

        </object>

    </div>



    <div class="title" style="margin-top: 60px;">Domain shifts</div>

    <div class="line"></div>

    <div class="domain-shifts-container">

        <object data="globe.svg" type="image/svg+xml" width="200" height="65" style="margin-left: 20px;">

            <img src="globe.svg" alt="Globe visualization" />

        </object>

        <object data="histogram.svg" type="image/svg+xml" width="607" height="196" style="margin-left: -10px;">

            <img src="histogram.svg" alt="Histogram visualization" />

        </object>

    </div>



    <div class="title" style="margin-top: 10px;">Ambiguities</div>

    <div class="line" style="margin-bottom: 0px;"></div>

    <div style="display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: -40px;">

        <svg width="120" height="360" style="display: flex; align-items: center; justify-content: center; margin-left: 20px;">

            <text x="100" y="180" transform="rotate(-90 100 180)" fill="white" font-size="24" font-family="Arial" font-weight="bold" text-anchor="middle" dominant-baseline="middle">

                <tspan x="100" dy="-0.6em">Multimodal</tspan>

                <tspan x="100" dy="1.2em">input</tspan>

            </text>

        </svg>

        <object data="vector_encoder.svg" type="image/svg+xml" width="165" height="210" style="margin-left: -20px;">

            <img src="vector_encoder.svg" alt="Vector encoder" />

        </object>

        <div style="position: relative; margin-left: -70px;">

            <object data="3d_modalities_spherical.svg" type="image/svg+xml" width="700" height="336">

                <img src="3d_modalities_spherical.svg" alt="3D modalities visualization" />

            </object>

            <object data="precipitation_white.svg" type="image/svg+xml" width="40" height="40" style="position: absolute; top: 150px; left: 60px;">

                <img src="precipitation_white.svg" alt="Precipitation" />

            </object>

            <object data="geolocation_white.svg" type="image/svg+xml" width="40" height="40" style="position: absolute; top: 250px; left: 130px;">

                <img src="geolocation_white.svg" alt="Geolocation" />

            </object>

            <object data="satellite.svg" type="image/svg+xml" width="40" height="40" style="position: absolute; top: 250px; left: 350px;">

                <img src="satellite.svg" alt="Satellite" />

            </object>

        </div>

    </div>

</body>

</html>
