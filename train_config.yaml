seed: 42

hydra:
  job:
    chdir: true
  run:
    dir: experiments/${task}/${split_type}/${model_type}/${now:%Y-%m-%d_%H-%M-%S}

logger:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  project: "mmearth-bench"
  name: "${task}_${split_type}_${model_type}"
  log_model: true
  entity: "luciagordon-harvard-university"

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 200
  logger: ${logger}
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  deterministic: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: "Val loss"
      save_last: true
      dirpath: "checkpoints"

datamodule:
  _target_: datamodule.DataModule
  task: "${task}"
  split_type: "${split_type}"
  batch_size: 64
  data_dir_path: "/n/davies_lab/Users/luciagordon/mmearth-bench"
  num_workers: 0

model:
  _target_: model.Model
  task: "${task}"
  model: "${model_type}"
