project: mmearth-bench
entity: luciagordon-harvard-university
name: soil_nitrogen_g_resnet50_imagenet_lp
program: train.py
method: grid
metric:
  name: "Val RMSE"
  goal: minimize
parameters:
  model.max_lr:
    values: [1e-2, 1e-1, 1e-0]
  model.weight_decay:
    values: [0, 1e-3, 1e-2, 1e-1]
  # model.decay_factor:
  #   values: [0.9, 0.8, 0.7, 0.6]
command:
  - python
  - train.py
  - +task=soil_nitrogen
  - +split_type=geographic
  - +model_type=resnet50_imagenet
  - +adaptation_mode=lp
